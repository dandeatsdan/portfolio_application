[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-modeller"
version = "0.1.0"
description = "Upstream Portfolio Scenario Modelling – software learning experiment"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.35",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
